version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - io.Copy
        - os.Remove
        - os.RemoveAll
  exclusions:
    rules:
      # Best-effort cleanup: closing connections/files/bodies and flushing
      # terminal output have no useful error handling.
      - linters: [errcheck]
        text: "Error return value of `[^`]*\\.(Close|Flush)` is not checked"

formatters:
  enable:
    - gofmt
